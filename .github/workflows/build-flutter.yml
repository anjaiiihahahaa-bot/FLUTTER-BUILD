name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      ref_id:
        description: 'Ref ID dari bot'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Auto-retry Flutter SDK versions sampai ketemu yang cocok ──
      - name: Setup Flutter (try 3.24.5)
        id: flutter_3245
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Setup Flutter (try 3.22.3)
        id: flutter_3223
        if: steps.flutter_3245.outcome == 'failure'
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Setup Flutter (try 3.19.6)
        id: flutter_3196
        if: steps.flutter_3245.outcome == 'failure' && steps.flutter_3223.outcome == 'failure'
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Setup Flutter (try 3.16.9)
        id: flutter_3169
        if: steps.flutter_3245.outcome == 'failure' && steps.flutter_3223.outcome == 'failure' && steps.flutter_3196.outcome == 'failure'
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: Setup Flutter (fallback latest stable)
        id: flutter_latest
        if: steps.flutter_3245.outcome == 'failure' && steps.flutter_3223.outcome == 'failure' && steps.flutter_3196.outcome == 'failure' && steps.flutter_3169.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          APP_NAME=$(grep "^name:" pubspec.yaml | sed 's/name: //' | tr -d ' ')
          cp "$APK" "${APP_NAME}.apk"
          echo "APK_FILE=${APP_NAME}.apk" >> $GITHUB_ENV
          echo "APK_NAME=${APP_NAME}"     >> $GITHUB_ENV
          echo "✅ APK: ${APP_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-apk
          path: ${{ env.APK_FILE }}
          retention-days: 3
