name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      ref_id:
        description: 'Reference ID for this build'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Fix font_awesome_flutter compatibility
        run: |
          if grep -q "font_awesome_flutter" pubspec.yaml; then
            echo "Detected font_awesome_flutter — attempting upgrade to 10.8.0"
            flutter pub add font_awesome_flutter:^10.8.0 || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
