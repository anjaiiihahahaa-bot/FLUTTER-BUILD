import re, os, pathlib

def rw(path, subs):
    if not os.path.isfile(path): return
    txt = pathlib.Path(path).read_text(errors='replace')
    orig = txt
    for pat, rep in subs:
        txt = re.sub(pat, rep, txt)
    if txt != orig:
        pathlib.Path(path).write_text(txt)
        print('patched:', path)

# 1. compileSdk / targetSdk = 36
sdk = [
    (r'compileSdkVersions+d+', 'compileSdkVersion 36'),
    (r'compileSdks*=s*d+',   'compileSdk = 36'),
    (r'compileSdks+d+',        'compileSdk 36'),
    (r'targetSdkVersions+d+',  'targetSdkVersion 36'),
    (r'targetSdks*=s*d+',    'targetSdk = 36'),
    (r'targetSdks+d+',         'targetSdk 36'),
]
for f in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
    rw(f, sdk)

# 2. AGP 8.9.1 + Kotlin 2.0.0
agp = [
    (r'com.android.tools.build:gradle:[0-9][0-9.]*',         'com.android.tools.build:gradle:8.9.1'),
    (r'org.jetbrains.kotlin:kotlin-gradle-plugin:[0-9][0-9.]*', 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'),
    (r"ext.kotlin_versions*=s*['""][0-9][^'"]*['""]",  "ext.kotlin_version = '2.0.0'"),
    (r'vals+kotlinVersions*=s*"[0-9][^"]*"',                 'val kotlinVersion = "2.0.0"'),
]
for f in ['android/build.gradle', 'android/build.gradle.kts']:
    rw(f, agp)

# 3. Gradle wrapper 8.11.1
rw('android/gradle/wrapper/gradle-wrapper.properties',
   [(r'gradle-[0-9][^-]*-bin.zip', 'gradle-8.11.1-bin.zip')])

# 4. gradle.properties
os.makedirs('android', exist_ok=True)
gp = 'android/gradle.properties'
c = pathlib.Path(gp).read_text() if os.path.isfile(gp) else ''
for k, v in [
    ('android.suppressUnsupportedCompileSdk', '36'),
    ('android.enableJetifier',                'true'),
    ('android.useAndroidX',                   'true'),
    ('android.nonTransitiveRClass',           'false'),
    ('android.overrideVersionCheck',          'true'),
    ('android.experimental.disableCompileSdkVersionCheck', 'true'),
    ('org.gradle.jvmargs',                    '-Xmx4g -XX:MaxMetaspaceSize=1g'),
]:
    if k not in c:
        c += f'
{k}={v}'
pathlib.Path(gp).write_text(c)

# 5. font_awesome_flutter downgrade
rw('pubspec.yaml', [(r'font_awesome_flutter:s*^10.[0-9.]+', 'font_awesome_flutter: ^10.10.0')])

print('compatibility patch done')
PYEOF
      - name: Clean + Pub Get
        run: |
          flutter clean || true
          rm -rf android/.gradle build .dart_tool
          flutter pub get

      # ── Auto upgrade major versions (best-effort, retry 3x) ──
      - name: Pub Upgrade (best-effort)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            flutter pub upgrade --major-versions && break || echo "retry $i ..."
            sleep 3
          done

      # ── Patch IconData + FaIconData (Python) ─────────────────────────────
      - name: Patch IconData (font_awesome_flutter)
        run: |
          cat > /tmp/patch_fa.py << 'PYEOF'
import re, os, pathlib, glob

# 1. Patch package: extends IconData -> implements IconData
pub = os.path.expanduser('~/.pub-cache')
for f in glob.glob(pub + '/**/*font_awesome_flutter*/**/*.dart', recursive=True):
    try:
        p = pathlib.Path(f)
        t = p.read_text(errors='replace')
        t2 = t.replace(' extends IconData', ' implements IconData')
        if t2 != t:
            p.write_text(t2)
            print('pkg:', f)
    except: pass

# 2. pubspec: font_awesome_flutter -> ^10.10.0
if os.path.isfile('pubspec.yaml'):
    p = pathlib.Path('pubspec.yaml')
    t = p.read_text()
    t2 = re.sub(r'font_awesome_flutter:s*^10.[0-9.]+', 'font_awesome_flutter: ^10.10.0', t)
    if t2 != t: p.write_text(t2); print('pubspec: fa downgraded')

# 3. Dart source: Icon(FontAwesomeIcons.x) -> FaIcon(FontAwesomeIcons.x)
FA_IMPORT = "import 'package:font_awesome_flutter/font_awesome_flutter.dart';"
PAT = re.compile(r'(?<![a-zA-Z])Icons*(s*(FontAwesomeIcons.[a-zA-Z0-9_]+)')
for f in glob.glob('lib/**/*.dart', recursive=True):
    try:
        p = pathlib.Path(f)
        t = p.read_text(errors='replace')
        t2 = PAT.sub(lambda m: 'FaIcon(' + m.group(1), t)
        if t2 != t:
            if FA_IMPORT not in t2: t2 = FA_IMPORT + '
' + t2
            p.write_text(t2); print('dart:', f)
    except Exception as e: print('skip:', f, e)

print('patch done')
PYEOF
          python3 /tmp/patch_fa.py
      # ── BUILD APK (try 1) ──
      - name: Build APK (try 1)
        id: build1
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --target-platform=android-arm64,android-arm,android-x64 \
            --split-debug-info=build/debug 2>&1 | tee /tmp/build1.log

      # ── ERROR HANDLING CERDAS: parse log build1 ──
      - name: Smart Retry — Auto Fix berdasarkan error
        if: steps.build1.outcome == 'failure'
        run: |
          echo "⚠️ Build try 1 gagal. Analisa log..."
          LOG=/tmp/build1.log

          # 1. IconData cannot be extended - re-patch
          if grep -qE "IconData.*can.?t be extended|subtype of the sealed class.*IconData" "$LOG"; then
            echo "🔧 Detected: IconData extends error → re-patch package"
            find "$HOME/.pub-cache" -type f -name "*.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/extends[[:space:]]\+IconData/implements IconData/g' {} \; || true
          fi

          # 2. compileSdk 35 vs 36 → force 36
          if grep -qE "compileSdk(Version)?\s*=?\s*35|requires.*compileSdk.*36" "$LOG"; then
            echo "🔧 Detected: compileSdk mismatch → force 36"
            [ -f android/app/build.gradle ]     && sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g' android/app/build.gradle || true
            [ -f android/app/build.gradle ]     && sed -i 's/compileSdk[[:space:]]\+[0-9]\+/compileSdk 36/g' android/app/build.gradle
            [ -f android/app/build.gradle.kts ] && sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          # 3. "Gradle version dropped" / AGP mismatch → skip validation
          if grep -qE "Gradle version.*dropped|Android Gradle plugin.*requires|minimum supported Gradle" "$LOG"; then
            echo "🔧 Detected: Gradle/AGP mismatch → suppress validation"
            grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
            grep -q "android.overrideVersionCheck"          android/gradle.properties || echo "android.overrideVersionCheck=true"         >> android/gradle.properties
          fi

          # 4. Dart SDK version solving failed / package requires newer SDK
          # Handle: "Because X requires SDK version ^3.8.1, version solving failed."
          if grep -qE "requires SDK version|version solving failed|The current Dart SDK version is" "$LOG"; then
            echo "🔧 Detected: Dart SDK constraint mismatch!"
            CURRENT_DART=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "   Current Dart: $CURRENT_DART"
            if [ -f pubspec.yaml ]; then
              echo "   Patching pubspec.yaml sdk constraint to >=${CURRENT_DART} <5.0.0"
              sed -i "s/sdk:[[:space:]]*['\"]*>=\?[0-9][^'\"\ \n]*/sdk: '>=${CURRENT_DART} <5.0.0'/" pubspec.yaml || true
            fi
            flutter pub cache repair || true
          fi

          # 5. dependency conflict → try upgrade
          if grep -qE "Because .* depends on .* which doesn.t match|incompatible" "$LOG"; then
            echo "🔧 Detected: dependency conflict → try pub upgrade --major-versions"
            flutter pub upgrade --major-versions || true
          fi

      - name: Build APK (try 2 — after auto fix)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter clean || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons \
            --target-platform=android-arm64,android-arm,android-x64 \
            --split-debug-info=build/debug 2>&1 | tee /tmp/build2.log

      # ── Last resort: build minimal (arm64 only) ─────────────────────────
      - name: Build APK (try 3 — minimal)
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        run: |
          cat > /tmp/patch_try3.py << 'PYEOF'
