name: Build Flutter APK
# AUTO-GENERATED by riff-bot
# Flutter : 3.44.1
# Java    : 17
# Generated: 2026-06-06T03:18:24.945Z

on:
  workflow_dispatch:
    inputs:
      ref_id:
        description: 'Ref ID dari bot'
        required: false
        default: ''

env:
  ANDROID_COMPILE_SDK: '36'
  ANDROID_TARGET_SDK: '36'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"'
  FLUTTER_VERSION: '3.44.1'

jobs:
  build:
    name: Build APK (Flutter 3.44.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Auto-detected Flutter version dari pubspec.yaml ──────────────────
      # Flutter 3.44.1 — dipilih otomatis oleh riff-bot berdasarkan Dart SDK constraint
      - name: Setup Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart version
        run: |
          flutter --version
          dart --version
          echo "✅ Flutter 3.44.1 + Java 17 aktif"

      # ── VERIFIKASI pubspec.yaml Dart SDK constraint ──────────────────
      - name: Verify pubspec.yaml Dart SDK
        run: |
          echo "=== Verifikasi Dart SDK constraint ==="
          if [ ! -f pubspec.yaml ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          echo "--- environment block ---"
          grep -A5 "^environment:" pubspec.yaml || echo "(tidak ada environment block)"
          echo "-------------------------"
          DART_REQ=$(grep -E "^[[:space:]]+sdk:" pubspec.yaml | head -1 | tr -d ' 	' | sed 's/sdk://' | tr -d "'" | tr -d '"' || echo "tidak ditemukan")
          DART_ACTUAL=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Dart SDK required : $DART_REQ"
          echo "Dart SDK installed: $DART_ACTUAL"
          echo "Flutter installed : 3.44.1"
          echo "Verifikasi selesai ✅"

      # ── AUTO-FIX COMPATIBILITY ──────────────────────────────────────────
      - name: Auto Fix Compatibility
        run: |
          set -e

          # 1. Force compileSdk / targetSdk = 36 di build.gradle (Groovy)
          if [ -f android/app/build.gradle ]; then
            echo "📝 Patching android/app/build.gradle ..."
            sed -i 's/compileSdkVersion[[:space:]]\+[0-9]\+/compileSdkVersion 36/g'  android/app/build.gradle || true
            sed -i 's/compileSdk[[:space:]]\+[0-9]\+/compileSdk 36/g'                android/app/build.gradle || true
            sed -i 's/targetSdkVersion[[:space:]]\+[0-9]\+/targetSdkVersion 36/g'    android/app/build.gradle || true
            sed -i 's/targetSdk[[:space:]]\+[0-9]\+/targetSdk 36/g'                  android/app/build.gradle || true
          fi

          # 2. Force compileSdk / targetSdk = 36 di build.gradle.kts (Kotlin DSL)
          if [ -f android/app/build.gradle.kts ]; then
            echo "📝 Patching android/app/build.gradle.kts ..."
            sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g'   android/app/build.gradle.kts || true
            sed -i 's/compileSdk[[:space:]]\+[0-9]\+/compileSdk = 36/g'              android/app/build.gradle.kts || true
            sed -i 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]\+/targetSdk = 36/g'     android/app/build.gradle.kts || true
            sed -i 's/targetSdk[[:space:]]\+[0-9]\+/targetSdk = 36/g'                android/app/build.gradle.kts || true
          fi

          # 3. Skip validasi Gradle / AGP / Kotlin
          mkdir -p android
          touch android/gradle.properties
          grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=36"        >> android/gradle.properties
          grep -q "android.enableJetifier"               android/gradle.properties || echo "android.enableJetifier=true"                    >> android/gradle.properties
          grep -q "android.useAndroidX"                  android/gradle.properties || echo "android.useAndroidX=true"                       >> android/gradle.properties
          grep -q "android.nonTransitiveRClass"          android/gradle.properties || echo "android.nonTransitiveRClass=false"              >> android/gradle.properties
          grep -q "android.overrideVersionCheck"         android/gradle.properties || echo "android.overrideVersionCheck=true"              >> android/gradle.properties
          grep -q "org.gradle.jvmargs"                   android/gradle.properties || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> android/gradle.properties

          # 4. Downgrade font_awesome_flutter kalo versi tidak kompatibel
          if grep -q "font_awesome_flutter:[[:space:]]*\^10\." pubspec.yaml 2>/dev/null; then
            echo "🔄 Downgrade font_awesome_flutter ke ^10.10.0 ..."
            sed -i 's/font_awesome_flutter:[[:space:]]*\^10\.[0-9.]\+/font_awesome_flutter: ^10.10.0/g' pubspec.yaml || true
          fi

          # 5. Upgrade AGP + Gradle wrapper + Kotlin
          if [ -f android/build.gradle ]; then
            echo "📝 Upgrading AGP + Kotlin di android/build.gradle ..."
            sed -i 's/com.android.tools.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:8.9.1/g' android/build.gradle || true
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.2.20'/g" android/build.gradle || true
            sed -i 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = '"'"'2.2.20'"'"'/g' android/build.gradle || true
            sed -i 's/org.jetbrains.kotlin:kotlin-gradle-plugin:[0-9][0-9.]*/org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20/g' android/build.gradle || true
          fi
          GW="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GW" ]; then
            echo "📝 Upgrading Gradle wrapper ke 8.14 ..."
            sed -i 's|distributions/gradle-[0-9][^-]*-|distributions/gradle-8.14-|g' "$GW" || true
          fi
          grep -q "android.experimental.disableCompileSdkVersionCheck" android/gradle.properties 2>/dev/null ||             echo "android.experimental.disableCompileSdkVersionCheck=true" >> android/gradle.properties

          echo "✅ Compatibility patch selesai"

      - name: Clean + Pub Get
        run: |
          flutter clean || true
          rm -rf android/.gradle build .dart_tool
          flutter pub get

      # ── Auto upgrade major versions (best-effort, retry 3x) ──
      - name: Pub Upgrade (best-effort)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            flutter pub upgrade --major-versions && break || echo "retry $i ..."
            sleep 3
          done

      # ── Patch IconData "extends" → "implements" + FaIconData type fix ──
      - name: Patch IconData (font_awesome_flutter)
        run: |
          PUB_CACHE_DIR="$HOME/.pub-cache"
          if [ -d "$PUB_CACHE_DIR" ]; then
            # Patch 1: extends IconData → implements IconData (semua class)
            find "$PUB_CACHE_DIR" -type f -name "*.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/class[[:space:]]\+IconDataBrands[[:space:]]\+extends[[:space:]]\+IconData/class IconDataBrands implements IconData/g' {} \; || true
            find "$PUB_CACHE_DIR" -type f -name "*.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/class[[:space:]]\+IconDataSolid[[:space:]]\+extends[[:space:]]\+IconData/class IconDataSolid implements IconData/g'   {} \; || true
            find "$PUB_CACHE_DIR" -type f -name "*.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/class[[:space:]]\+IconDataRegular[[:space:]]\+extends[[:space:]]\+IconData/class IconDataRegular implements IconData/g' {} \; || true

            # Patch 2: FaIconData → IconData type cast fix (Flutter 3.44.1 sealed IconData)
            # FaIcon(icon) dimana icon bertipe FaIconData tidak bisa assign ke IconData
            # Fix: patch icon_data.dart supaya FaIconData implements IconData
            find "$PUB_CACHE_DIR" -type f -name "icon_data.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/class FaIconData extends IconData/class FaIconData implements IconData/g' {} \; || true

            # Patch 3: Hapus const constructor yang incompatible (sealed class issue)
            find "$PUB_CACHE_DIR" -type f -name "*.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/extends[[:space:]]\+IconData/implements IconData/g' {} \; || true

            # Patch 4: Fix landing_page.dart — FaIcon(icon) dimana icon bertipe IconData
            # Error: "argument type 'IconData' can't be assigned to parameter type 'FaIconData?'"
            # Fix: wrap dengan FaIcon(FaIconData(icon.codePoint, ...)) atau cast di file asli
            # Approach: patch icon_data.dart supaya FaIconData(codePoint) accept IconData codePoint
            find "$PUB_CACHE_DIR" -type f -name "icon_data.dart" -path "*font_awesome_flutter*" \
              -exec grep -l "class FaIconData" {} \; | while read f; do
                # Tambah factory constructor kalau belum ada
                grep -q "factory FaIconData.fromIconData" "$f" || \
                  sed -i '/^class FaIconData/,/^}/ s/^}/  factory FaIconData.fromIconData(IconData d) => FaIconData(d.codePoint, fontFamily: d.fontFamily, fontPackage: d.fontPackage);
}/' "$f" || true
              done || true

            echo "✅ IconData patched (extends→implements + FaIconData fix)"
          fi

          # Patch 4: Force font_awesome_flutter ke versi terbaru yang kompatibel Flutter 3.44
          # Jika masih ^10.5.0, upgrade ke ^10.10.0 yang support sealed IconData
          if [ -f pubspec.yaml ]; then
            if grep -qE "font_awesome_flutter:[[:space:]]*\^10\.[0-9]" pubspec.yaml; then
              CURR_VER=$(grep -oE "font_awesome_flutter:[[:space:]]*\^[0-9.]+" pubspec.yaml | grep -oE "[0-9]+\.[0-9]+" | head -1)
              echo "font_awesome_flutter current: $CURR_VER → force ^10.10.0"
              sed -i 's/font_awesome_flutter:[[:space:]]*\^10\.[0-9.]\+/font_awesome_flutter: ^10.10.0/g' pubspec.yaml || true
            fi
          fi

      # ── BUILD APK (try 1) ──
      - name: Build APK (try 1)
        id: build1
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --target-platform=android-arm64,android-arm,android-x64 \
            --split-debug-info=build/debug \
            --android-skip-build-dependency-validation 2>&1 | tee /tmp/build1.log

      # ── ERROR HANDLING CERDAS: parse log build1 ──
      - name: Smart Retry — Auto Fix berdasarkan error
        if: steps.build1.outcome == 'failure'
        run: |
          echo "⚠️ Build try 1 gagal. Analisa log..."
          LOG=/tmp/build1.log

          # 1. IconData cannot be extended - re-patch
          if grep -qE "IconData.*can.?t be extended|subtype of the sealed class.*IconData" "$LOG"; then
            echo "🔧 Detected: IconData extends error → re-patch package"
            find "$HOME/.pub-cache" -type f -name "*.dart" -path "*font_awesome_flutter*" \
              -exec sed -i 's/extends[[:space:]]\+IconData/implements IconData/g' {} \; || true
          fi

          # 2. compileSdk 35 vs 36 → force 36
          if grep -qE "compileSdk(Version)?\s*=?\s*35|requires.*compileSdk.*36" "$LOG"; then
            echo "🔧 Detected: compileSdk mismatch → force 36"
            [ -f android/app/build.gradle ]     && sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g' android/app/build.gradle || true
            [ -f android/app/build.gradle ]     && sed -i 's/compileSdk[[:space:]]\+[0-9]\+/compileSdk 36/g' android/app/build.gradle
            [ -f android/app/build.gradle.kts ] && sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          # 3. "Gradle version dropped" / AGP mismatch → skip validation
          if grep -qE "Gradle version.*dropped|Android Gradle plugin.*requires|minimum supported Gradle" "$LOG"; then
            echo "🔧 Detected: Gradle/AGP mismatch → suppress validation"
            grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
            grep -q "android.overrideVersionCheck"          android/gradle.properties || echo "android.overrideVersionCheck=true"         >> android/gradle.properties
          fi

          # 4. Dart SDK version solving failed / package requires newer SDK
          # Handle: "Because X requires SDK version ^3.8.1, version solving failed."
          if grep -qE "requires SDK version|version solving failed|The current Dart SDK version is" "$LOG"; then
            echo "🔧 Detected: Dart SDK constraint mismatch!"
            CURRENT_DART=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "   Current Dart: $CURRENT_DART"
            if [ -f pubspec.yaml ]; then
              echo "   Patching pubspec.yaml sdk constraint to >=${CURRENT_DART} <5.0.0"
              sed -i "s/sdk:[[:space:]]*['\"]*>=\?[0-9][^'\"\ \n]*/sdk: '>=${CURRENT_DART} <5.0.0'/" pubspec.yaml || true
            fi
            flutter pub cache repair || true
          fi

          # 5. dependency conflict → try upgrade
          if grep -qE "Because .* depends on .* which doesn.t match|incompatible" "$LOG"; then
            echo "🔧 Detected: dependency conflict → try pub upgrade --major-versions"
            flutter pub upgrade --major-versions || true
          fi

          # 6. AAR metadata AGP version check → skip validation
          if grep -qE "checkReleaseAarMetadata|requires Android Gradle plugin [0-9]" "$LOG"; then
            echo "🔧 Detected: AAR metadata AGP check error → skip dependency validation"
            grep -q "android.overrideVersionCheck" android/gradle.properties || echo "android.overrideVersionCheck=true" >> android/gradle.properties
            grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
            grep -q "android.experimental.disableCompileSdkVersionCheck" android/gradle.properties || echo "android.experimental.disableCompileSdkVersionCheck=true" >> android/gradle.properties
            # Force AGP 8.9.1 di build.gradle
            if [ -f android/build.gradle ]; then
              sed -i 's/com.android.tools.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:8.9.1/g' android/build.gradle || true
            fi
            if [ -f android/settings.gradle ]; then
              sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.9.1"/g' android/settings.gradle || true
              sed -i "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.9.1'/g" android/settings.gradle || true
            fi
            if [ -f android/settings.gradle.kts ]; then
              sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.9.1"/g' android/settings.gradle.kts || true
            fi
          fi

      - name: Build APK (try 2 — after auto fix)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter clean || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons \
            --target-platform=android-arm64,android-arm,android-x64 \
            --split-debug-info=build/debug \
            --android-skip-build-dependency-validation 2>&1 | tee /tmp/build2.log

      # ── Last resort: build minimal (arm64 only, no split) ──
      - name: Build APK (try 3 — minimal)
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        run: |
          set -o pipefail
          flutter clean || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --target-platform=android-arm64 \
            --android-skip-build-dependency-validation 2>&1 | tee /tmp/build3.log

      - name: Rename APK
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan"
            exit 1
          fi
          APP_NAME=$(grep "^name:" pubspec.yaml | sed 's/name: //' | tr -d ' ')
          [ -z "$APP_NAME" ] && APP_NAME="app"
          cp "$APK" "${APP_NAME}.apk"
          echo "APK_FILE=${APP_NAME}.apk" >> $GITHUB_ENV
          echo "APK_NAME=${APP_NAME}"     >> $GITHUB_ENV
          echo "✅ APK siap: ${APP_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-apk
          path: ${{ env.APK_FILE }}
          retention-days: 3

      - name: Upload build logs (kalau gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build*.log
          retention-days: 3
